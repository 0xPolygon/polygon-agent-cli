name = "agentconnect"
compatibility_date = "2024-07-04"
workers_dev = false
preview_urls = false
send_metrics = false
placement = { mode = "smart" }

main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The credentials API and the MCP server's OAuth routes are handled by the
# worker, never the SPA fallback.
run_worker_first = [
  "/api/*",
  "/mcp",
  "/authorize",
  "/oauth/*",
  "/.well-known/oauth-authorization-server",
  "/.well-known/oauth-protected-resource",
  "/.well-known/oauth-protected-resource/*"
]

# Credentials API. Secrets come from the GitHub environment and are uploaded
# with each deploy (see .github/workflows/deploy-agentconnect-ui.yml):
#   AGENT_CERT_SECRET  random 32+ bytes; signs agent certificates
#   CREDENTIALS_KEY    random 32+ bytes; seals saved details in KV
#   AGENTCARD_CLIENT_ID / AGENTCARD_CLIENT_SECRET  AgentCard client credentials (cards)
#   INDEXER_ACCESS_KEY the dashboard's indexer key; balances for the MCP server
# Saved details live in the CREDENTIALS KV namespace. Without it, or without
# CREDENTIALS_KEY, the address endpoints answer 503. The MCP server needs the
# OAUTH_KV namespace too; without it /mcp is not served.

# Drop the old SessionRelay Durable Object carried over from connector-ui.
[[migrations]]
tag = "v2"
deleted_classes = ["SessionRelay"]

[env.staging]
name = "agentconnect-staging"
# Its own list: the top-level SessionRelay migration must not apply here. v3
# adds the per-wallet payment lock (worker/wallet-lock.ts).
migrations = [{ tag = "v3", new_sqlite_classes = ["WalletLock"] }]

# staging.agents.polygon.technology serves the staging install guide and skills
# to hosted assistants, which can't pass Cloudflare Access.
routes = [
  { pattern = "agentconnect.staging.polygon.technology", custom_domain = true },
  { pattern = "staging.agents.polygon.technology", custom_domain = true }
]

# No migrations: the staging worker never had the SessionRelay class, and
# Cloudflare refuses to delete a class that doesn't exist.

# No id: wrangler creates the namespace on the first deploy.
[[env.staging.kv_namespaces]]
binding = "CREDENTIALS"

# MCP: the OAuth provider's clients, grants, and tokens, plus pending sign-ins.
[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"

# One Durable Object per wallet, so a payment is claimed once. No route reaches
# it: only this worker, through the binding.
[[env.staging.durable_objects.bindings]]
name = "WALLET_LOCK"
class_name = "WalletLock"

# MCP client registration (/oauth/register) is open to any app: at most 10 a
# minute from one address. namespace_id is any number unique to this account.
[[env.staging.ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "4101"
simple = { limit = 10, period = 60 }

[env.production]
name = "agentconnect-production"
# Its own list, as for staging: the SessionRelay class was deleted long ago,
# and wrangler now refuses to delete a class that doesn't exist.
migrations = [{ tag = "v3", new_sqlite_classes = ["WalletLock"] }]

# agents.polygon.technology serves the assistant install guide (/skill.md)
# and the skills from the same assets.
routes = [
  { pattern = "agentconnect.polygon.technology", custom_domain = true },
  { pattern = "agents.polygon.technology", custom_domain = true }
]

[[env.production.ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "4102"
simple = { limit = 10, period = 60 }

[[env.production.durable_objects.bindings]]
name = "WALLET_LOCK"
class_name = "WalletLock"

name = "agentconnect"
compatibility_date = "2024-07-04"
workers_dev = false
preview_urls = false
send_metrics = false
placement = { mode = "smart" }

main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The credentials API is handled by the worker, never the SPA fallback.
run_worker_first = ["/api/*"]

# Credentials API. Secrets are set per environment with `wrangler secret put`:
#   AGENT_CERT_SECRET  random 32+ bytes; signs agent certificates
#   OMS_API_KEY        OMS secret API key (sk_...)
#   OMS_API_SECRET     its matching apiSecret
# Without OMS_API_URL and both OMS secrets the address endpoints answer 503.

# Drop the old SessionRelay Durable Object carried over from connector-ui.
[[migrations]]
tag = "v2"
deleted_classes = ["SessionRelay"]

[env.staging]
name = "agentconnect-staging"
vars = { OMS_API_URL = "https://sandbox-api.polygon.technology/v0.13" }
# Explicitly empty: without this, the top-level SessionRelay migration applies.
migrations = []

routes = [
  { pattern = "agentconnect.staging.polygon.technology", custom_domain = true }
]

# No migrations: the staging worker never had the SessionRelay class, and
# Cloudflare refuses to delete a class that doesn't exist.

[env.production]
name = "agentconnect-production"

# agents.polygon.technology serves the assistant install guide (/setup.md)
# and the skills from the same assets.
routes = [
  { pattern = "agentconnect.polygon.technology", custom_domain = true },
  { pattern = "agents.polygon.technology", custom_domain = true }
]

[[env.production.migrations]]
tag = "v2"
deleted_classes = ["SessionRelay"]

name: Deploy OIDC Relay to Cloudflare

# Merge to `staging` -> deploy the staging worker; production deploys run from
# release tags (deploy-oidc-relay-release.yml). The relay has no build step and
# no runtime deps, so we deploy it straight with wrangler. wrangler is a
# devDependency of the package, so the deploy runs the version in the lockfile.

on:
  push:
    branches:
      - staging
    paths:
      - 'packages/oidc-relay/**'
      - '.github/workflows/deploy-oidc-relay.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - staging
        default: staging

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy (staging)
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: packages/oidc-relay
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # wrangler runs from the lockfile, so it has to be installed first.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Deploy to staging
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_WORKER_ACCOUNT_ID }}

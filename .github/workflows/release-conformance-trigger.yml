name: Release workflow conformance

# Checks this repository's npm release workflows against the shared release
# standard (see "Release workflow conformance" in 0xPolygon/pipelines' README).
# It reads workflow files only and needs no secrets. It is informative while it
# is not a required check; a repository ruleset may later require it, at which
# point this trigger file is removed.

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  conformance:
    uses: 0xPolygon/pipelines/.github/workflows/apps-release-conformance.yml@main

packages:
  - packages/*

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@polygonlabs/*'
  - '@maticnetwork/*'
  - '@agglayer/*'
  - '@0xsequence/*'
  - '@0xtrails/*'
  - '0xtrails'
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@5.7.2 || 6.3.1'
  - 'vite'

overrides:
  '@noble/curves': 1.9.7
  '@noble/hashes': 1.8.0
  slow-redact: 0.3.1

packages:
  - packages/*

blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@polygonlabs/*'
  - '@maticnetwork/*'
  - '@agglayer/*'
  - '@0xsequence/*'
  - '@0xtrails/*'
  - '0xtrails'
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'vite@5.4.21'

overrides:
  '@noble/curves': 1.9.7
  '@noble/hashes': 1.8.0
  slow-redact: 0.3.1
